<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1035" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎤%3C/text%3E%3C/svg%3E" />
    <title>Autotune</title>
  </head>
  <body>
    <main class="app">
      <header>
        <h1>🎤 Autotune</h1>
      </header>

      <section id="tuner" class="tuner" data-tune="none" aria-live="polite">
        <div class="note" data-note>–</div>
        <div class="cents" data-cents>Tryck på Starta</div>
        <div class="meter" aria-hidden="true">
          <span class="meter-label">−50</span>
          <div class="meter-track">
            <div class="meter-center"></div>
            <div class="meter-needle" data-needle></div>
          </div>
          <span class="meter-label">+50</span>
        </div>
        <div class="freq" data-freq></div>
        <div class="target" data-target></div>
      </section>

      <p id="message" class="message" role="alert" hidden></p>

      <button id="start" class="big-button" type="button">Starta</button>
      <button id="resume" class="big-button secondary" type="button" hidden>Tryck för att fortsätta</button>

      <section id="recorder" class="recorder" aria-label="Inspelning">
        <button id="record" class="record-button" type="button" aria-pressed="false">⏺ Spela in</button>
        <div id="record-timer" class="record-timer" role="timer" hidden>0:00 / 5:00</div>

        <div id="take" class="take" hidden>
          <div class="take-header">
            <strong>🎵 Din inspelning</strong>
            <span id="take-info" class="take-info"></span>
          </div>
          <audio id="take-audio" controls preload="auto"></audio>
          <div class="take-actions">
            <a id="take-download" class="take-button" href="#" download>⬇️ Ladda ner</a>
            <button id="take-discard" class="take-button secondary" type="button">🗑️ Släng</button>
          </div>
        </div>
      </section>

      <button id="monitor" class="toggle-button" type="button" aria-pressed="false">🎧 Hör mig själv: AV</button>
      <p id="headphones-tip" class="tip" hidden>
        🎧 <strong>Använd hörlurar med sladd!</strong> Annars tjuter det i högtalaren, och trådlösa lurar gör att ljudet kommer för sent.
      </p>

      <section class="styles" aria-labelledby="styles-heading">
        <h2 id="styles-heading">Välj stil</h2>
        <div id="presets" class="preset-grid"></div>
      </section>

      <details id="settings" class="panel">
        <summary>⚙️ Inställningar</summary>
        <div class="settings-grid">
          <label for="key">Tonart</label>
          <select id="key"></select>

          <label for="scale">Skala</label>
          <select id="scale"></select>

          <label for="retune">Rättningsfart <output id="retune-value" for="retune"></output></label>
          <input id="retune" type="range" min="0" max="200" step="5" />

          <label for="mix">Autotune-mängd <output id="mix-value" for="mix"></output></label>
          <input id="mix" type="range" min="0" max="100" step="5" />

          <label for="volume">Medhörningsvolym <output id="volume-value" for="volume"></output></label>
          <input id="volume" type="range" min="0" max="100" step="5" />
        </div>
      </details>

      <details class="debug">
        <summary>Teknisk info</summary>
        <pre id="debug-info"></pre>
      </details>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
